name: Deploy to Production (manual)

# DESACTIVADO EN AUTOMÁTICO — el despliegue lo hace Hostinger.
#
# El servidor se actualiza por su propia integración con Git desde hPanel, así
# que este flujo ya no se dispara en cada push: solo fallaba en el paso de SSH
# (faltan los secretos SSH_HOST / SSH_USERNAME / SSH_PRIVATE_KEY / SSH_PORT) y
# generaba una notificación de error por cada commit.
#
# Se conserva, y no se borra, porque sigue siendo la vía de despliegue si algún
# día Hostinger deja de servir. Para reactivarlo:
#   1. Cargar los cuatro secretos SSH en Settings > Secrets and variables > Actions.
#   2. Opcionalmente el secreto APP_DIR con la ruta de la app en el servidor.
#   3. Devolver el disparador `push` que quedó comentado abajo.
# Mientras tanto se puede lanzar a mano desde la pestaña Actions.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Auto-bump patch version ──────────────────────────────────────────────
      - name: Bump patch version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          npm version patch --no-git-tag-version --prefix frontend
          npm version patch --no-git-tag-version --prefix backend
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          git add package.json frontend/package.json backend/package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push

      # ── Validate builds (catch errors before hitting the server) ─────────────
      - name: Build frontend (validate)
        run: |
          npm install --include=dev --prefix frontend
          npm run build --prefix frontend

      - name: Build backend (validate)
        run: |
          npm install --include=dev --prefix backend
          npm run build --prefix backend

      # ── Deploy to Hostinger via SSH ──────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # El directorio de la app no se fija a un dominio concreto: al mover
            # el sitio a otro subdominio, Hostinger crea ~/domains/<dominio>/ y
            # un APP_DIR quemado deja el despliegue apuntando al sitio viejo sin
            # que nada falle de forma visible. Se puede forzar con el secreto
            # APP_DIR; si no, se busca el checkout real.
            APP_DIR="${{ secrets.APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              for d in ~/domains/dashboard.neurofic.com/nodejs \
                       ~/domains/neurofic.easystem.co/nodejs; do
                if [ -d "$d/.git" ]; then APP_DIR="$d"; break; fi
              done
            fi
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: no se encontró el checkout de la app."
              echo "Dominios disponibles en el servidor:"
              ls -1 ~/domains 2>/dev/null || echo "  (no existe ~/domains)"
              echo "Define el secreto APP_DIR con la ruta correcta (la que contiene .git)."
              exit 1
            fi
            echo "=== APP_DIR: $APP_DIR ==="

            echo "=== Pulling latest code ==="
            cd "$APP_DIR"
            git pull origin main

            echo "=== Installing backend dependencies ==="
            npm install --prefix backend --omit=dev

            echo "=== Running database migrations ==="
            npm run db:migrate --prefix backend

            echo "=== Building backend ==="
            npm run build --prefix backend

            echo "=== Installing frontend dependencies ==="
            npm install --prefix frontend --omit=dev

            echo "=== Building frontend ==="
            npm run build --prefix frontend

            echo "=== Writing COMMIT_SHA for /api/version ==="
            COMMIT=$(git rev-parse --short HEAD)
            sed -i "s/^COMMIT_SHA=.*/COMMIT_SHA=$COMMIT/" .env 2>/dev/null || echo "COMMIT_SHA=$COMMIT" >> .env

            echo "=== Restarting application (Passenger) ==="
            mkdir -p "$APP_DIR/tmp"
            touch "$APP_DIR/tmp/restart.txt"

            echo "=== Deploy complete — version $(node -p "require('./package.json').version") ==="
